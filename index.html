<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Varian Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
    body {
        margin: 0;
        background: #000;
        overflow: hidden;
        font-family: 'Noto Serif KR', serif;
        color: #fff;
    }

    /* 🌫 안개와 번개 효과 캔버스 */
    canvas {
        position: fixed;
        top: 0; left: 0;
        z-index: 1;
        pointer-events: none;
    }

    /* ⚔️ 오프닝 */
    #intro {
        position: fixed;
        width: 100%; height: 100%;
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
        transition: 1.5s;
    }

    #introText {
        color: #fff;
        font-size: 28px;
        letter-spacing: 8px;
        cursor: pointer;
        opacity: 0.5;
        transition: 0.5s;
        animation: pulse 3s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }
    #introText:hover { opacity: 1; letter-spacing: 12px; }

    /* 🏰 메인 레이아웃 */
    #main {
        display: none;
        height: 100vh;
        position: relative;
        z-index: 2;
    }

    .background {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: url('tarantia_castle.jpg') center/cover no-repeat;
        filter: brightness(0.3) contrast(1.2);
        z-index: -1;
    }

    /* 제목: 멸망이 아닌 재건의 느낌 */
    .header {
        position: absolute;
        top: 50px; width: 100%;
        text-align: center;
        letter-spacing: 10px;
        text-shadow: 0 0 20px rgba(255,255,255,0.5);
    }

    /* 이미지 컨테이너: 눌림 방지 */
    .container {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 60px;
    }

    .card {
        position: relative;
        width: 380px;
        height: 550px; /* 고정 높이로 눌림 방지 */
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.2);
        cursor: pointer;
        transition: 0.5s ease-in-out;
        box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    .card img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* 사진이 영역에 꽉 차게 조절 (눌림 방지 핵심) */
        transition: 1.5s;
        filter: grayscale(0.5) brightness(0.8);
    }

    .card:hover {
        transform: translateY(-20px);
        border-color: #fff;
        box-shadow: 0 0 50px rgba(255,255,255,0.2);
    }

    .card:hover img {
        transform: scale(1.1);
        filter: grayscale(0) brightness(1);
    }

    /* 📜 대사 오버레이 */
    .overlay {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.95);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 20;
        animation: fadeIn 0.8s;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .overlay-content {
        text-align: center;
        max-width: 800px;
        line-height: 2.5;
        font-size: 22px;
        letter-spacing: 1px;
    }
    .highlight { color: #aaa; font-style: italic; }
</style>
</head>

<body>

<canvas id="effectCanvas"></canvas>

<div id="intro">
    <div id="introText" onclick="enterMain()">배신, 그리고 재건의 시작.</div>
</div>

<div id="main">
    <div class="background"></div>
    <div class="header">
        <h1>TARANTIA: THE REBORN EMPIRE</h1>
    </div>

    <div class="container">
        <div class="card" onclick="openText('story1')">
            <img src="varian1.png">
        </div>
        <div class="card" onclick="openText('story2')">
            <img src="varian2.png">
        </div>
    </div>
</div>

<div id="story1" class="overlay" onclick="closeText()">
    <div class="overlay-content">
        <p>'어미를 삼키고 태어난 자'.</p>
        <p>평생 사랑을 몰랐던 소년의 곁을 지켰던 유일한 온기.</p>
        <p>함께 전장을 누비던 시간들 모두 기만이었음을 깨달았을 때,</p>
        <p>그의 심장은 얼음보다 차갑게 굳어버렸다.</p>
    </div>
</div>

<div id="story2" class="overlay" onclick="closeText()">
    <div class="overlay-content">
        <p>파국을 딛고 다시 세운 타란티아, 그 옥좌 위에서 내린 첫 번째 심판.</p>
        <p>검을 쥔 손은 떨렸으나, 그의 눈빛에는 더 이상 흔들림이 없다.</p>
        <br>
        <p style="font-size: 30px; letter-spacing: 5px;">"...다시는 내 눈 앞에 나타나지 마라."</p>
        <br>
        <p class="highlight">그것이 그가 줄 수 있는 마지막 자비였다.</p>
    </div>
</div>

<script>
function enterMain(){
    document.getElementById('intro').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('intro').style.display = 'none';
        document.getElementById('main').style.display = 'block';
    }, 1500);
}
function openText(id){ document.getElementById(id).style.display = 'flex'; }
function closeText(){ document.querySelectorAll('.overlay').forEach(o=>o.style.display='none'); }

/* 🌫 안개와 가끔 치는 번개 효과 */
const canvas = document.getElementById('effectCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
for(let i=0; i<80; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 100 + 50,
        opacity: Math.random() * 0.1,
        vel: Math.random() * 0.5
    });
}

function draw() {
    ctx.clearRect(0,0,canvas.width, canvas.height);
    
    // 안개 그리기
    ctx.fillStyle = "rgba(200, 200, 200, 0.05)";
    for(let p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
        p.x += p.vel;
        if(p.x > canvas.width + p.size) p.x = -p.size;
    }

    // 가끔 번개 치는 효과 (화면 전체가 아주 잠깐 밝아짐)
    if(Math.random() > 0.995) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
        ctx.fillRect(0,0,canvas.width, canvas.height);
    }
    
    requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
